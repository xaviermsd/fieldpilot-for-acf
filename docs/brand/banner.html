<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FieldPilot banner (772x250, render at 1x and 2x)</title>
<link rel="stylesheet" href="brand.css">
<style>
	.stage { width: 772px; height: 250px; display: flex; align-items: center; padding: 0 22px 0 30px; gap: 20px; }
	.hero { flex: 0 0 262px; }
	.brand { display: flex; align-items: center; gap: 10px; }
	.word { font-size: 33px; }
	.eyebrow { font-size: 8px; margin-top: 14px; }
	.badge { position: static; margin-top: 12px; font-size: 9.5px; padding: 5px 6px 5px 11px; gap: 7px; }
	.badge .dot { width: 5px; height: 5px; margin-right: 6px; }
	.badge .seg { font-size: 6.5px; padding: 3px 7px; }
	.headline { font-size: 19.5px; margin-top: 7px; }
	.ticks { gap: 11px; font-size: 10px; margin-top: 12px; }
	.grid { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
	.card { border-radius: 11px; padding: 11px 11px 12px; height: 100px; }
	.card .chip { width: 23px; height: 23px; border-radius: 7px; font-size: 13px; }
	.card .tag { top: 11px; right: 11px; font-size: 6.5px; }
	.card h3 { font-size: 11.5px; margin-top: 12px; white-space: nowrap; }
	.card p { font-size: 9.5px; margin-top: 4px; line-height: 1.35; }
</style>
</head>
<body>
<div class="stage">
	<div class="hero">
		<div class="brand">
			<img class="mark" src="icon.png" width="50" height="50" alt="">
			<div class="word">Field<span>Pilot</span></div>
		</div>
		<div class="eyebrow">AI &amp; JSON copilot for ACF</div>
		<div class="headline">Change ACF fields safely.<br><em>Undo when you are wrong.</em></div>
		<div class="badge"><i class="dot"></i>Built for ACF<span class="seg free">Free</span><span class="seg pro">PRO</span></div>
	</div>
	<div class="grid" id="grid"></div>
</div>
<script src="features.js"></script>
</body>
</html>
