name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  unit:
    name: Unit & property — PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Unit suite
        run: vendor/bin/phpunit --testsuite unit

      - name: Property suite
        run: vendor/bin/phpunit --testsuite property

  static:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPCS
        run: vendor/bin/phpcs

      # acf_import_field_group() DELETES every field absent from its payload.
      # Confining it is what stops a bug in the update path from destroying a
      # customer's field group. See docs/ARCHITECTURE-REVIEW.md B.5.
      - name: Destructive API is confined
        run: |
          echo "Checking acf_import_field_group() call sites…"
          FOUND=$(grep -rn "acf_import_field_group(" includes/ | grep -v "^includes/Apply/Restore.php" | grep -v "^includes/Apply/Writer.php" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::acf_import_field_group() called outside Restore.php / Writer.php:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK — confined to the permitted call sites."

  integration:
    name: Integration — ACF ${{ matrix.acf }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        acf: [ '6.2', '6.5', '6.8' ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start WordPress
        run: npx wp-env start

      # ACF PRO cannot be fetched in CI without a licence key, so this job proves
      # the free-tier paths. PRO coverage comes from the local smoke run.
      - name: Install ACF (free)
        run: npx wp-env run cli wp plugin install advanced-custom-fields --version=${{ matrix.acf }} --activate

      - name: Smoke test
        run: npx wp-env run cli --env-cwd=wp-content/plugins/wp-acf-json-pro wp eval-file tools/smoke.php
